!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header">
    <h1>🩺 Disease Prediction System</h1>
    <p>Predict diabetes using Machine Learning</p>
</div>

<div class="container">

<div class="left">

<h2>Patient Information</h2>

<form action="/predict" method="POST">

<label>💧 Pregnancies</label>
<input type="number" name="Pregnancies" required>

<label>🩸 Glucose</label>
<input type="number" name="Glucose" required>

<label>❤️ Blood Pressure</label>
<input type="number" name="BloodPressure" required>

<label>📏 Skin Thickness</label>
<input type="number" name="SkinThickness" required>

<label>💉 Insulin</label>
<input type="number" name="Insulin" required>

<label>⚖️ BMI</label>
<input type="number" step="0.1" name="BMI" required>

<label>👪 Diabetes Pedigree Function</label>
<input type="number" step="0.001" name="DiabetesPedigreeFunction" required>

<label>📅 Age</label>
<input type="number" name="Age" required>

<input class="btn" type="submit" value="Predict Disease">

</form>

</div>

<div class="right">

<h2>Prediction Result</h2>

{% if prediction_text %}
<div class="result">
<h1>{{ prediction_text }}</h1>
</div>
{% else %}
<div class="result">
<h1>Enter Values & Click Predict</h1>
</div>
{% endif %}

</div>

</div>

</body>
</html>
